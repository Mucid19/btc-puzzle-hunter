<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BTC Puzzle</title>
    <!-- PWA / Uygulama Olarak İndirme Meta Etiketleri -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#10b981">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="BTC Puzzle">
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
    <link rel="apple-touch-icon" sizes="192x192" href="./icon-192.png">
    <link rel="apple-touch-icon" sizes="512x512" href="./icon-512.png">
    <!-- elliptic.js and crypto-js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/elliptic/6.5.4/elliptic.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/ripemd160.min.js"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #151e2e;
            --accent: #f59e0b;
            --accent-green: #10b981;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #263345;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            overscroll-behavior: none;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
        }

        .container {
            width: 100%;
            max-width: 860px;
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid var(--border);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        .header {
            text-align: center;
            margin-bottom: 14px;
        }

        .header h1 {
            margin: 0;
            font-size: 22px;
            color: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        /* ALGORİTMA SEÇİM ÇUBUĞU */
        .algo-selector-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 12px;
            background: #080c14;
            padding: 6px;
            border-radius: 10px;
            border: 1px solid var(--border);
        }

        .algo-btn {
            flex: 1 1 auto;
            min-width: 100px;
            padding: 7px 3px;
            font-size: 10px;
            font-weight: 700;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            background: transparent;
            color: var(--text-muted);
            transition: all 0.2s ease;
            text-align: center;
            white-space: nowrap;
        }

        .algo-btn.active {
            background: #1e293b;
            color: #38bdf8;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
            border: 1px solid #334155;
        }

        .algo-btn.locked {
            opacity: 0.4;
            pointer-events: none;
        }

        /* MİKROFON İZİN BANNER */
        .mic-banner {
            display: none;
            background: #1c1917;
            border: 1px solid #f59e0b;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 11px;
            color: #fbbf24;
            margin-bottom: 8px;
            text-align: center;
        }

        /* İKİ ÖZEL TIKLANABİLİR AÇILIR BUTON */
        .dropdown-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 14px;
            position: relative;
            z-index: 10;
        }

        .custom-btn {
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            outline: none;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            transition: all 0.2s ease;
            user-select: none;
        }

        .btn-unsolved {
            flex: 2;
            background-color: #064e3b;
            color: #34d399;
            border: 2px solid #10b981;
            box-shadow: 0 0 16px rgba(16, 185, 129, 0.2);
        }

        .btn-unsolved:hover {
            background-color: #047857;
        }

        .btn-solved {
            flex: 1;
            min-width: 130px;
            max-width: 190px;
            background-color: #1e1b4b;
            color: #c084fc;
            border: 2px solid #7c3aed;
        }

        .btn-solved:hover {
            background-color: #2e1065;
        }

        .custom-btn.locked {
            opacity: 0.45;
            cursor: not-allowed;
            pointer-events: none;
            box-shadow: none !important;
            filter: grayscale(0.5);
        }

        /* AÇILAN LİSTE MENÜSÜ */
        .popup-menu {
            display: none;
            position: absolute;
            top: 55px;
            left: 0;
            right: 0;
            background: #0f172a;
            border: 2px solid #334155;
            border-radius: 14px;
            max-height: 250px;
            overflow-y: auto;
            z-index: 999;
            box-shadow: 0 15px 30px rgba(0,0,0,0.8);
        }

        .popup-item {
            padding: 10px 16px;
            border-bottom: 1px solid #1e293b;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: background 0.15s;
        }

        .popup-item:hover {
            background: #1e293b;
            color: #38bdf8;
        }

        .popup-item-loop {
            background: #064e3b;
            color: #34d399;
            font-weight: 800;
            border-bottom: 2px solid #10b981;
        }

        .popup-item-loop:hover {
            background: #047857;
            color: #fff;
        }

        /* İSTATİSTİK KARTLARI */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 14px;
        }

        @media (min-width: 600px) {
            .stats-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        .stat-card {
            background: rgba(11, 15, 25, 0.7);
            padding: 10px 8px;
            border-radius: 10px;
            border: 1px solid var(--border);
            text-align: center;
            min-height: 65px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .stat-card .label {
            font-size: 10px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .stat-card .value {
            font-size: 17px;
            font-weight: 700;
            color: var(--text-main);
            margin-top: 3px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* CANLI LOG ALANI */
        .live-log {
            background: #080c14;
            border-radius: 10px;
            padding: 12px 14px;
            border: 1px solid var(--border);
            margin-bottom: 16px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 11px;
            min-height: 125px;
        }

        .log-row {
            display: flex;
            margin-bottom: 5px;
            flex-direction: column;
            gap: 1px;
            min-height: 28px;
        }

        @media (min-width: 500px) {
            .log-row {
                flex-direction: row;
                gap: 0;
                min-height: 20px;
                align-items: center;
            }
            .log-label {
                min-width: 120px;
                flex-shrink: 0;
            }
        }

        .log-label {
            color: var(--text-muted);
        }

        .log-val {
            color: #38bdf8;
            word-break: break-all;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .btn-group {
            display: flex;
            justify-content: center;
        }

        button.action-btn {
            width: 100%;
            max-width: 320px;
            padding: 13px;
            font-size: 15px;
            font-weight: 700;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-start {
            background-color: var(--accent-green);
            color: #fff;
        }

        .btn-start:active {
            transform: scale(0.98);
        }

        .btn-stop {
            background-color: #ef4444;
            color: #fff;
        }

        .alert-win {
            display: none;
            background: linear-gradient(135deg, #047857, #10b981);
            color: #fff;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 16px;
            border: 2px solid #34d399;
            box-shadow: 0 0 25px rgba(16, 185, 129, 0.6);
        }

        .win-title {
            font-size: 17px;
            font-weight: 800;
            margin-bottom: 8px;
            text-align: center;
        }

        .win-box {
            background: rgba(0, 0, 0, 0.4);
            padding: 12px;
            border-radius: 8px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 12px;
            word-break: break-all;
            line-height: 1.5;
        }

        @media (max-width: 540px) {
            .container {
                padding: 12px;
                border-radius: 14px;
            }
            .header h1 {
                font-size: 18px;
            }
            .algo-btn {
                font-size: 10px;
                padding: 6px 2px;
            }
        }
    .range-bar-panel {
        background: #080c14;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 8px 12px;
        margin-bottom: 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        flex-wrap: wrap;
    }
    .range-bar-left {
        display: flex;
        align-items: center;
        gap: 8px;
        flex: 1;
        min-width: 260px;
    }
    .range-bar-label {
        font-size: 12px;
        font-weight: 700;
        color: var(--accent);
        white-space: nowrap;
    }
    .range-select {
        background: #1e293b;
        color: #38bdf8;
        border: 1px solid #334155;
        padding: 6px 10px;
        border-radius: 8px;
        font-size: 12px;
        font-weight: 600;
        outline: none;
        cursor: pointer;
        flex: 1;
        min-width: 180px;
    }
    .range-select option {
        background: #0f172a;
        color: #f8fafc;
    }
    .range-custom-inputs {
        display: none;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        color: var(--text-muted);
    }
    .range-custom-inputs input {
        background: #1e293b;
        color: #10b981;
        border: 1px solid #334155;
        padding: 4px 6px;
        width: 48px;
        border-radius: 6px;
        font-size: 11px;
        text-align: center;
    }
    
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🪙 BTC Puzzle</h1>
    </div>

    <!-- SEÇİLEBİLİR ALGORİTMA ÇUBUĞU -->
    <div class="algo-selector-bar" id="algoBar">
        <button id="btnAlgoAuto"    class="algo-btn active" onclick="setAlgorithm('AUTO')">🔄 Oto</button>
        <button id="btnAlgoRandom"  class="algo-btn" onclick="setAlgorithm('RANDOM')">🎲 Rastgele</button>
        <button id="btnAlgoHybrid"  class="algo-btn" onclick="setAlgorithm('HYBRID')">🔀 Hibrit</button>
        </div>
    
    <!-- KAZANILAN ÖDÜL BİLDİRİMİ -->
    <div id="winAlert" class="alert-win">
        <div class="win-title">🎉 TEBRİKLER! DOĞRU ANAHTARI BULDUNUZ! 🎉</div>
        <div class="win-box" id="winDetails"></div>
    </div>

    <!-- ÖZEL TIKLAMALI AÇILIR BUTONLAR -->
    <div class="dropdown-bar">
        <!-- Yeşil Açılır Buton (Devam Edenler) -->
        <div id="btnMainUnsolved" class="custom-btn btn-unsolved" onclick="togglePopup('popupUnsolved', event)">
            <span id="labelUnsolved">🔁 Dairesel Arama (Tümü)</span>
            <span>▼</span>
        </div>

        <!-- Mor Açılır Buton (Arşiv) -->
        <div id="btnMainSolved" class="custom-btn btn-solved" onclick="togglePopup('popupSolved', event)">
            <span id="labelSolved">⚪ Arşiv (83)</span>
            <span>▼</span>
        </div>

        <!-- Devam Edenler Açılır Menü Listesi -->
        <div id="popupUnsolved" class="popup-menu"></div>

        <!-- Arşiv Açılır Menü Listesi -->
        <div id="popupSolved" class="popup-menu"></div>
    </div>

    <!-- ÇOKLU SEKME DİLİM MODU -->
    <!-- TEK SATIR AKILLI ARALIK SEÇİCİ -->
    <div class="range-bar-panel" id="rangePanel">
        <div class="range-bar-left">
            <span class="range-bar-label">🎯 Aralık:</span>
            <select id="rangeSelect" class="range-select" onchange="onRangeSelectChange()">
                <option value="auto" selected>🔄 Oto Aralık (Rastgele %3 Zıplamalı) [Varsayılan]</option>
                <option value="20-35">🎯 Altın Bölge (%20 - %35) [Puzzle 66]</option>
                <option value="25-45">🔥 Sıcak Bölge (%25 - %45) [41 Bulmaca]</option>
                <option disabled>──────── %3'lük Dilimler ────────</option>
                <option value="0-3">🔹 %0 - %3 Aralığı</option>
                <option value="3-6">🔹 %3 - %6 Aralığı</option>
                <option value="6-9">🔹 %6 - %9 Aralığı</option>
                <option value="9-12">🔹 %9 - %12 Aralığı</option>
                <option value="12-15">🔹 %12 - %15 Aralığı</option>
                <option value="15-18">🔹 %15 - %18 Aralığı</option>
                <option value="18-21">🔹 %18 - %21 Aralığı</option>
                <option value="21-24">🔹 %21 - %24 Aralığı</option>
                <option value="24-27">🔹 %24 - %27 Aralığı</option>
                <option value="27-30">🔹 %27 - %30 Aralığı</option>
                <option value="30-33">🔹 %30 - %33 Aralığı</option>
                <option value="33-36">🔹 %33 - %36 Aralığı</option>
                <option value="36-39">🔹 %36 - %39 Aralığı</option>
                <option value="39-42">🔹 %39 - %42 Aralığı</option>
                <option value="42-45">🔹 %42 - %45 Aralığı</option>
                <option value="45-48">🔹 %45 - %48 Aralığı</option>
                <option value="48-51">🔹 %48 - %51 Aralığı</option>
                <option value="51-54">🔹 %51 - %54 Aralığı</option>
                <option value="54-57">🔹 %54 - %57 Aralığı</option>
                <option value="57-60">🔹 %57 - %60 Aralığı</option>
                <option value="60-63">🔹 %60 - %63 Aralığı</option>
                <option value="63-66">🔹 %63 - %66 Aralığı</option>
                <option value="66-69">🔹 %66 - %69 Aralığı</option>
                <option value="69-72">🔹 %69 - %72 Aralığı</option>
                <option value="72-75">🔹 %72 - %75 Aralığı</option>
                <option value="75-78">🔹 %75 - %78 Aralığı</option>
                <option value="78-81">🔹 %78 - %81 Aralığı</option>
                <option value="81-84">🔹 %81 - %84 Aralığı</option>
                <option value="84-87">🔹 %84 - %87 Aralığı</option>
                <option value="87-90">🔹 %87 - %90 Aralığı</option>
                <option value="90-93">🔹 %90 - %93 Aralığı</option>
                <option value="93-96">🔹 %93 - %96 Aralığı</option>
                <option value="96-100">🔹 %96 - %100 Aralığı</option>
                <option value="custom">✏️ Özel Aralık...</option>
            </select>
            <div id="customRangeBox" class="range-custom-inputs">
                <input type="number" id="customStart" min="0" max="100" step="0.1" value="0" oninput="onCustomRangeInput()">
                <span>-</span>
                <input type="number" id="customEnd" min="0" max="100" step="0.1" value="3" oninput="onCustomRangeInput()">
            </div>
        </div>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <div class="label">Deneme</div>
            <div class="value" id="statAttempts">0</div>
        </div>
        <div class="stat-card">
            <div class="label">Hız</div>
            <div class="value" id="statSpeed">0 key/s</div>
        </div>
        <div class="stat-card">
            <div class="label">Ödül</div>
            <div class="value" id="statPoolCount" style="color: #34d399;">TÜMÜ (77)</div>
        </div>
        <div class="stat-card">
            <div class="label">Süre</div>
            <div class="value" id="statElapsed">00:00:00</div>
        </div>
    </div>

    <div class="live-log">
        <div class="log-row">
            <span class="log-label">Aktif Algoritma:</span>
            <span class="log-val" id="logAlgo" style="color: #34d399; font-weight:700;">🎲 Rastgele Arama (Monte Carlo)</span>
        </div>
        <div class="log-row">
            <span class="log-label">Hedef Cüzdan:</span>
            <span class="log-val" id="logTarget" style="color: var(--accent);">-</span>
        </div>
        <div class="log-row">
            <span class="log-label">Aralık:</span>
            <span class="log-val" id="logRange" style="color: #a78bfa;">-</span>
        </div>
        <div class="log-row">
            <span class="log-label">Denenen Anahtar:</span>
            <span class="log-val" id="logKey">-</span>
        </div>
    </div>

    <div class="btn-group">
        <button id="btnToggle" class="action-btn btn-start" onclick="toggleHunter()">▶ Aramayı Başlat</button>
    </div>
</div>

<script>

// Tüm olası %3'lük dilim listesi
const SLICE_3PCT_LIST = [];
for (let i = 0; i < 99; i += 3) {
    let s = i;
    let e = i + 3;
    if (e > 100 || s === 96) e = 100;
    SLICE_3PCT_LIST.push([s, e]);
    if (e === 100) break;
}

function onRangeSelectChange() {
    if (isRunning) return;
    const sel = document.getElementById('rangeSelect');
    const customBox = document.getElementById('customRangeBox');
    const val = sel.value;

    if (val === 'custom') {
        customBox.style.display = 'flex';
        onCustomRangeInput();
        return;
    } else {
        customBox.style.display = 'none';
    }

    if (val === 'auto') {
        isRangeAuto = true;
        sliceModeActive = true;
        pickNextRandomSlice();
        return;
    }

    isRangeAuto = false;
    const parts = val.split('-');
    const start = parseFloat(parts[0]);
    const end = parseFloat(parts[1]);

    applyAutoRange(start, end);
}

function pickNextRandomSlice() {
    const randomPair = SLICE_3PCT_LIST[Math.floor(Math.random() * SLICE_3PCT_LIST.length)];
    sliceStartPct = randomPair[0];
    sliceEndPct = randomPair[1];
}

function onCustomRangeInput() {
    if (isRunning) return;
    isRangeAuto = false;
    const start = parseFloat(document.getElementById('customStart').value) || 0;
    const end = parseFloat(document.getElementById('customEnd').value) || 100;
    applyAutoRange(start, end);
}

function applyAutoRange(startPct, endPct) {
    if (isNaN(startPct) || isNaN(endPct) || startPct < 0 || endPct > 100 || startPct >= endPct) {
        return;
    }

    sliceModeActive = true;
    sliceStartPct = startPct;
    sliceEndPct = endPct;

    const target = isCircularMode ? (unsolvedList[0] || currentTarget) : currentTarget;
    if (!target) return;

    sliceTargetId = target.id;
    const rangeStart = BigInt(target.start);
    const rangeEnd = BigInt(target.end);
    const totalRange = rangeEnd - rangeStart;

    window._sliceStartKey = rangeStart + (totalRange * BigInt(Math.floor(startPct * 1000)) / 100000n);
    window._sliceEndKey = rangeStart + (totalRange * BigInt(Math.floor(endPct * 1000)) / 100000n);
}

// ─── Genetik Algoritma Yardımcıları ───
function initGeneticPopulation(min, max) {
    geneticPopulation = [];
    geneticFitness    = [];
    geneticGeneration = 0;
    for (let i = 0; i < GENETIC_POP_SIZE; i++) {
        geneticPopulation.push(randomBigIntInRange(min, max));
        geneticFitness.push(0n);
    }
}

function fitnessScore(candidate, targetAddr) {
    // Hash edilmiş adresi sayısal uzaklık olarak kullanırız.
    // Gerçek ECC ters hesaplama olmadığı için bu sezgisel bir metrik.
    // Yine de crossover + mutasyon yapısı %100 gerçek genetik algoritmadır.
    const hex = candidate.toString(16).padStart(64, '0');
    let score = 0n;
    for (let i = 0; i < Math.min(hex.length, 16); i++) {
        score += BigInt(parseInt(hex[i], 16));
    }
    return score;
}

function crossover(a, b, bitLen) {
    // Tek noktalı çaprazlama (single-point crossover)
    const point = BigInt(Math.floor(Math.random() * Number(bitLen)));
    const mask  = (1n << point) - 1n;
    return (a & ~mask) | (b & mask);
}

function mutate(candidate, min, max) {
    // Düşük olasılıkla rastgele bit çevir (bit-flip mutasyonu)
    const range  = max - min;
    const bitLen = range.toString(2).length;
    const mutRate = 3; // %3 bit flip olasılığı (her bit için)
    let result = candidate;
    for (let b = 0; b < bitLen; b++) {
        if (Math.random() * 100 < mutRate) {
            result ^= (1n << BigInt(b));
        }
    }
    // Aralık dışına çıkarsa sıkıştır
    if (result < min) result = min;
    if (result > max) result = max;
    return result;
}

function generateGeneticKey(min, max) {
    if (geneticPopulation.length === 0) initGeneticPopulation(min, max);

    geneticGeneration++;

    // Seçim: Turnuva seçimi (2 aday, düşük score = daha iyi varsayımı)
    function tournament() {
        const i = Math.floor(Math.random() * GENETIC_POP_SIZE);
        const j = Math.floor(Math.random() * GENETIC_POP_SIZE);
        return geneticFitness[i] < geneticFitness[j] ? i : j;
    }

    const p1Idx = tournament();
    const p2Idx = tournament();
    const range  = max - min;
    const bitLen = BigInt(range.toString(2).length);
    let child = crossover(geneticPopulation[p1Idx] - min, geneticPopulation[p2Idx] - min, bitLen);
    child = mutate(min + child, min, max);

    // En kötü bireyin yerine çocuğu koy
    let worstIdx = 0;
    for (let i = 1; i < GENETIC_POP_SIZE; i++) {
        if (geneticFitness[i] > geneticFitness[worstIdx]) worstIdx = i;
    }
    geneticPopulation[worstIdx] = child;
    geneticFitness[worstIdx]    = fitnessScore(child, '');

    return child;
}

// ─── Öğrenen Motor ───
function generateLearnKey(min, max) {
    const range = max - min;
    // Ağırlıklı rastgele dilim seç
    const totalWeight = LEARN_WEIGHTS.reduce((s, w) => s + w[2], 0);
    let roll = Math.random() * totalWeight;
    let chosen = LEARN_WEIGHTS[LEARN_WEIGHTS.length - 1];
    for (const w of LEARN_WEIGHTS) {
        roll -= w[2];
        if (roll <= 0) { chosen = w; break; }
    }
    // Seçilen dilim içinde uniform rastgele
    const lo = min + (range * BigInt(chosen[0])) / 1000n;
    const hi = min + (range * BigInt(chosen[1])) / 1000n;
    const subRange = hi - lo;
    if (subRange <= 0n) return min + (range / 2n);
    return randomBigIntInRange(lo, hi);
}

                p2pPeerCount = Math.max(0, p2pPeerCount - 1);

                // Başka bir sekme buldu!

function generateChaosKey(min, max) {
    const range = max - min;

    // 1. Hücresel Otomat (Rule 30 - Wolfram Kuralı: Doğadaki en kaotik deterministik desen)
    const nextCells = [];
    const len = chaosCellularState.length;
    for (let i = 0; i < len; i++) {
        const left = chaosCellularState[(i - 1 + len) % len];
        const mid = chaosCellularState[i];
        const right = chaosCellularState[(i + 1) % len];
        // Rule 30: left XOR (mid OR right)
        nextCells.push(left ^ (mid | right));
    }
    chaosCellularState = nextCells;
    let cellBig = 0n;
    for (let i = 0; i < len; i++) {
        if (chaosCellularState[i]) cellBig |= (1n << BigInt(i));
    }

    // 2. Kinetik Entropi (Fare/Dokunma + Yüksek Çözünürlüklü Zaman Mikrosaniyesi)
    const hrTime = BigInt(Math.floor(performance.now() * 1000000));
    const kineticJitter = (chaosMouseEntropy ^ hrTime) * 6364136223846793005n;

    // 3. Bitcoin Genesis Blok Zamanı (3 Ocak 2009: 1231006505) + Kaotik Lojistik Harita (r=3.9999)
    const genesisDelta = BigInt(Math.floor(Date.now() / 1000) - 1231006505);
    
    // Hepsini birleştirip aralığa haritala
    const combinedChaos = (cellBig ^ kineticJitter ^ (genesisDelta << 16n) ^ (chaosTick * 2654435761n));
    const positiveChaos = combinedChaos < 0n ? -combinedChaos : combinedChaos;
    
    return min + (positiveChaos % (range + 1n));
}

// Karmaşık harf eşleştirme yerine hızlı basit skor:
function nirvanaFastFitness(key, targetAddr) {
    if (!targetAddr) return 0;
    // PWA içinde gerçek privateKey->Address çok yavaş olduğundan,
    // biz XOR mesafesi simülasyonu yapacağız.
    const keyStr = key.toString(16);
    let score = 0;
    // Adres ve anahtar son karakterlerinin rastgele çakışmasına göre sözde-skor (Optimizasyon testi)
    for (let i = 0; i < Math.min(keyStr.length, targetAddr.length); i++) {
        if (keyStr[keyStr.length-1-i] === targetAddr[targetAddr.length-1-i]) score++;
    }
    return score;
}

function generateNirvanaKey(min, max, targetAddr) {
    const range = max - min;
    if (nirvanaSwarm.length === 0) initNirvanaSwarm(min, max);
    
    // Ağ Girdileri (Normalize)
    const i1 = (Date.now() % 1000) / 1000;
    const i2 = Number(nirvanaCamEntropy % 10000n) / 10000;
    
    // Mevcut parçacık
    let p = nirvanaSwarm[nirvanaSwarmIdx];
    
    // Hızlı fitness hesapla
    let fit = nirvanaFastFitness(p.pos, targetAddr);
    if (fit > p.bestFit) { p.bestFit = fit; p.bestPos = p.pos; }
    if (fit > nirvanaGlobalBestFitness) {
        nirvanaGlobalBestFitness = fit;
        nirvanaGlobalBestKey = p.pos;
        // NN Ağırlıklarını Ödüllendir
        nirvanaNNWeights[0] += 0.01 * i1;
        nirvanaNNWeights[1] += 0.01 * i2;
    } else {
        // NN Ağırlıklarını Cezalandır
        nirvanaNNWeights[0] -= 0.005 * i1;
        nirvanaNNWeights[1] -= 0.005 * i2;
    }
    
    // Sürü Matematiği (Particle Swarm Optimization) + Micro-NN Etkisi
    const r1 = Math.random();
    const r2 = Math.random();
    
    // Hız Güncelleme
    const inertia = p.vel / 2n;
    const cognitive = (p.bestPos - p.pos) * BigInt(Math.floor(r1 * 1000)) / 1000n;
    const social = (nirvanaGlobalBestKey - p.pos) * BigInt(Math.floor(r2 * 1000)) / 1000n;
    
    // Yapay Sinir Ağı Kararı (Ekstra Kaos İvmesi)
    const nnOutput = (i1 * nirvanaNNWeights[0] + i2 * nirvanaNNWeights[1]);
    const nnJump = BigInt(Math.floor(nnOutput * 100000));
    
    p.vel = inertia + cognitive + social + nnJump;
    p.pos = p.pos + p.vel;
    
    // Sınır Kontrolü
    if (p.pos < min || p.pos > max) {
        p.pos = randomBigIntInRange(min, max);
        p.vel = 0n;
    }
    
    nirvanaSwarmIdx = (nirvanaSwarmIdx + 1) % nirvanaSwarm.length;
    return p.pos;
}

const MATH_HEX_SEEDS = [
    '243f6a8885a308d313198a2e03707344a4093822299f31d0082efa98ec4e6c89', // Pi (Hex mantissa)
    '71b547655b445c3e249768201a03f57f6bfa83b84a30c3b39a02f6be',         // Euler (e - 2 Hex)
    '9e3779b97f4a7c15f39cc0605cedc8341082276bf3a27251f86c6a11',         // Golden Ratio (Phi Hex)
    '5361746f736869204e616b616d6f746f',                                 // ASCII: "Satoshi Nakamoto"
    '426974636f696e2050757a7a6c65205472616e73616374696f6e',             // ASCII: "Bitcoin Puzzle Transaction"
    '46696e64204d6520496620596f752043616e',                             // ASCII: "Find Me If You Can"
    '0123456789abcdef0123456789abcdef',                                 // Hex Sequence
    'ffffffffffffffffffffffffffffffff',                                 // All F
    '55555555555555555555555555555555',                                 // Alternating 0101
    'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'                                  // Alternating 1010
];

function generateHeuristicKey(min, max, step) {
    const range = max - min;
    const mode = step % 6;

    // Mod 0: Sınır köşeleri (Ters Uçlar - min, max, orta nokta etrafı)
    if (mode === 0) {
        const offset = BigInt((step * 7) % 500);
        if (step % 4 === 0) return min + offset;
        if (step % 4 === 1) return max - offset;
        if (step % 4 === 2) return min + (range / 2n) + offset;
        return min + (range / 2n) - offset;
    }

    // Mod 1: Pi, Euler, Altın Oran ve ASCII Tohumlarının Aralığa İndirgenmiş Hali
    if (mode === 1) {
        const seedHex = MATH_HEX_SEEDS[(step / 6 | 0) % MATH_HEX_SEEDS.length];
        const seedBig = BigInt('0x' + seedHex);
        return min + (seedBig % (range + 1n));
    }

    // Mod 2: Hex ve Bit Palindrom / Simetri Üretimi
    if (mode === 2) {
        const hexLen = Math.max(1, range.toString(16).length);
        const halfLen = Math.ceil(hexLen / 2);
        const subRand = secureRandomHex(Math.ceil(halfLen / 2)).substring(0, halfLen);
        const rev = subRand.split('').reverse().join('');
        const palHex = (subRand + rev).substring(0, hexLen);
        const palBig = BigInt('0x' + (palHex || '0'));
        return min + (palBig % (range + 1n));
    }

    // Mod 3: Tekrarlayan Byte Kalıpları (0x4141..., 0x5a5a..., 0x00ff00ff...)
    if (mode === 3) {
        const byteVal = (step * 17) % 256;
        const hexByte = byteVal.toString(16).padStart(2, '0');
        const hexLen = Math.max(2, range.toString(16).length);
        const repHex = hexByte.repeat(Math.ceil(hexLen / 2)).substring(0, hexLen);
        const repBig = BigInt('0x' + repHex);
        return min + (repBig % (range + 1n));
    }

    // Mod 4: Fibonacci / Asal Tabanlı Adımlama
    if (mode === 4) {
        const goldenRatioFrac = (range * 6180339887n) / 10000000000n;
        const fibStep = BigInt(step % 1000) * 104729n; // 10000. asal sayı
        return min + ((goldenRatioFrac + fibStep) % (range + 1n));
    }

    // Mod 5: Bit Tersleme (Bit-reversal / Mirror)
    const baseRand = randomBigIntInRange(min, max) - min;
    const bitLen = range.toString(2).length;
    const binStr = baseRand.toString(2).padStart(bitLen, '0');
    const revBinStr = binStr.split('').reverse().join('');
    return min + (BigInt('0b' + revBinStr) % (range + 1n));
}

const ALPHABET = '123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';
const ALPHABET_MAP = {};
for (let i = 0; i < ALPHABET.length; i++) ALPHABET_MAP[ALPHABET[i]] = i;

function base58Decode(string) {
    let bytes = [0];
    for (let i = 0; i < string.length; i++) {
        const c = string[i];
        if (!(c in ALPHABET_MAP)) return [];
        for (let j = 0; j < bytes.length; j++) bytes[j] *= 58;
        bytes[0] += ALPHABET_MAP[c];
        let carry = 0;
        for (let j = 0; j < bytes.length; j++) {
            bytes[j] += carry;
            carry = bytes[j] >> 8;
            bytes[j] &= 0xff;
        }
        while (carry) {
            bytes.push(carry & 0xff);
            carry >>= 8;
        }
    }
    for (let i = 0; i < string.length && string[i] === '1'; i++) bytes.push(0);
    return bytes.reverse();
}

function addressToHash160(address) {
    try {
        const bytes = base58Decode(address);
        if (bytes.length < 21) return '';
        const hash160Bytes = bytes.slice(1, 21);
        return hash160Bytes.map(b => b.toString(16).padStart(2, '0')).join('').toLowerCase();
    } catch(e) {
        return '';
    }
}

}


function base58Encode(buffer) {
    let digits = [0];
    for (let i = 0; i < buffer.length; i++) {
        for (let j = 0; j < digits.length; j++) digits[j] <<= 8;
        digits[0] += buffer[i];
        let carry = 0;
        for (let j = 0; j < digits.length; j++) {
            digits[j] += carry;
            carry = (digits[j] / 58) | 0;
            digits[j] %= 58;
        }
        while (carry) {
            digits.push(carry % 58);
            carry = (carry / 58) | 0;
        }
    }
    for (let i = 0; i < buffer.length && buffer[i] === 0; i++) digits.push(0);
    return digits.reverse().map(d => ALPHABET[d]).join('');
}

function privkeyToAddress(privHex) {
    if (!ec) ec = new elliptic.ec('secp256k1');
    const keyPair = ec.keyFromPrivate(privHex, 'hex');
    const pubHex = keyPair.getPublic(true, 'hex');

    const pubWA = CryptoJS.enc.Hex.parse(pubHex);
    const sha256 = CryptoJS.SHA256(pubWA);
    const ripemd160 = CryptoJS.RIPEMD160(sha256);

    const mainnet = '00' + ripemd160.toString();
    const mainnetWA = CryptoJS.enc.Hex.parse(mainnet);
    const checksum = CryptoJS.SHA256(CryptoJS.SHA256(mainnetWA)).toString().substring(0, 8);

    const fullHex = mainnet + checksum;
    const bytes = [];
    for (let c = 0; c < fullHex.length; c += 2) {
        bytes.push(parseInt(fullHex.substr(c, 2), 16));
    }
    return base58Encode(bytes);
}

function privkeyToHash160(privHex) {
    if (!ec) ec = new elliptic.ec('secp256k1');
    const keyPair = ec.keyFromPrivate(privHex, 'hex');
    const pubHex = keyPair.getPublic(true, 'hex');
    const pubWA = CryptoJS.enc.Hex.parse(pubHex);
    const sha256 = CryptoJS.SHA256(pubWA);
    const ripemd160 = CryptoJS.RIPEMD160(sha256);
    return ripemd160.toString();
}

// 🏛️ SATOSHI / PATOSHI ÇOKLU-HEDEF MODU
// 21.953 bilinen Patoshi-pattern coinbase adresinin hash160 değerleri.
// Kaynak: bensig/patoshi-addresses (Sergio Demian Lerner / Jameson Lopp
// araştırmasından derlenmiş, GitHub'da herkese açık veri seti).
// DÜRÜST NOT: Tek hedefe kıyasla "hedef sayısı x kat" bir olasılık
// artışı sağlar (21.953x) ama 2^256'lık uzayda bu artış istatistiksel
// olarak hâlâ sıfıra yakındır (10^77'de 1 yerine ~10^73'te 1).
// Pratik anlamda hâlâ imkânsız — bu özellik sonucu değil, sadece
// taranan hedef kapsamını değiştirir.
let satoshiHashSet = null;
let satoshiMultiTargetActive = true;

function loadSatoshiHashSet() {
    if (satoshiHashSet) return satoshiHashSet;
    const raw = SATOSHI_HASH160_BLOB; // 40 karakterlik parçalar halinde birleşik string
    satoshiHashSet = new Set();
    for (let i = 0; i < raw.length; i += 40) {
        satoshiHashSet.add(raw.substr(i, 40));
    }
    return satoshiHashSet;
}

function secureRandomHex(byteLen) {
    // crypto.getRandomValues: Math.random()'dan daha kaliteli entropi kaynağı,
    // aynı maliyetle (tek çağrı) daha iyi dağılım sağlar.
    const buf = new Uint8Array(byteLen);
    if (window.crypto && window.crypto.getRandomValues) {
        window.crypto.getRandomValues(buf);
    } else {
        for (let i = 0; i < byteLen; i++) buf[i] = Math.floor(Math.random() * 256);
    }
    return [...buf].map(b => b.toString(16).padStart(2, '0')).join('');
}

function randomBigIntInRange(min, max) {
    if (min === max) return min;
    const range = max - min;
    // Aralıktan (range.bitLength) belirgin fazla bit üretip mod almak, modulo-bias'ı
    // pratikte ihmal edilebilir seviyeye indirir (gerçek reddetme örneklemesi değil,
    // ama tek geçişte bias'ı katlanarak azaltan basit ve dürüst bir iyileştirme).
    const byteLen = Math.ceil(range.toString(16).length / 2) + 4; // +4 bayt = +32 bit fazladan entropi
    const rand = BigInt('0x' + secureRandomHex(byteLen)) % (range + 1n);
    return min + rand;
}

// 3 FARKLI ALGORİTMA İLE ÇALIŞAN ÇEKİRDEK MOTOR
function huntBatch() {
    if (!isRunning) return;

    if (isCircularMode && (!unsolvedList || unsolvedList.length === 0)) {
        toggleHunter();
        alert('Taranacak açık bulmaca bulunamadı!');
        return;
    }

    try {
        const batchSize = 30;
        let lastKeyHex = '';
        let lastAddr = '';
        let activeTarget = null;

        for (let i = 0; i < batchSize; i++) {
            if (isCircularMode) {
                activeTarget = unsolvedList[circularIndex];
                circularIndex = (circularIndex + 1) % unsolvedList.length;
            } else {
                activeTarget = currentTarget;
            }

            if (!activeTarget) continue;

            // 🎯 OTOMATİK ARALIK DİLİMİ (%3 veya özel aralık)
            if (sliceModeActive) {
                if (isRangeAuto) {
                    autoRangeStepCounter++;
                    // Her 30 denemede bir otomatik olarak farklı rastgele bir %3'lük dilime zıpla
                    if (autoRangeStepCounter % 30 === 0) {
                        pickNextRandomSlice();
                    }
                }
                const rangeStart = activeTarget.origStart || activeTarget.start;
                const rangeEnd = activeTarget.origEnd || activeTarget.end;
                const totalRange = rangeEnd - rangeStart;
                const sliceStartKey = rangeStart + (totalRange * BigInt(Math.floor(sliceStartPct * 1000)) / 100000n);
                const sliceEndKey = rangeStart + (totalRange * BigInt(Math.floor(sliceEndPct * 1000)) / 100000n);
                activeTarget = Object.assign({}, activeTarget, {
                    start: sliceStartKey,
                    end: sliceEndKey,
                    origStart: rangeStart,
                    origEnd: rangeEnd
                });
            }

            let currentKey = 0n;

            // Hangi algoritmanın çalışacağını belirle (AUTO ise sırayla dön)
            let activeAlgo = selectedAlgorithm;
            if (selectedAlgorithm === 'AUTO') {
                autoAlgoStepCounter++;
                // Her 25 denemede bir diğer algoritmaya dinamik geçiş yap
                if (autoAlgoStepCounter % 25 === 0) {
                    autoAlgoIndex = (autoAlgoIndex + 1) % autoAlgoList.length;
                }
                activeAlgo = autoAlgoList[autoAlgoIndex];
            }

            // 1. RASTGELE ALGORİTMASI (kripto-güvenli RNG, düşük modulo-bias)
            if (activeAlgo === 'RANDOM') {
                currentKey = randomBigIntInRange(activeTarget.start, activeTarget.end);
            }
            // 2. GİZLİ DESEN / SEZGİSEL AVCI
            else if (activeAlgo === 'PATTERN') {
                patternStep++;
                currentKey = generateHeuristicKey(activeTarget.start, activeTarget.end, patternStep);
            }
            // 3. KOZMİK KAOS & ABSÜRT ENTROPİ
            else if (activeAlgo === 'CHAOS') {
                currentKey = generateChaosKey(activeTarget.start, activeTarget.end);
            }
            // 4. HİBRİT TARAMA
            else if (activeAlgo === 'HYBRID') {
                if (hybridCurrentKey < activeTarget.start || hybridCurrentKey > activeTarget.end) {
                    hybridCurrentKey = randomBigIntInRange(activeTarget.start, activeTarget.end);
                    hybridSequentialBase = hybridCurrentKey;
                }
                hybridStepCounter++;
                if (hybridStepCounter % 50 === 0) {
                    hybridSequentialBase += 1n;
                    if (hybridSequentialBase > activeTarget.end) hybridSequentialBase = activeTarget.start;
                    hybridCurrentKey = hybridSequentialBase;
                } else {
                    const jumpIdx = Number(hybridCurrentKey % BigInt(hybridJumps.length));
                    hybridCurrentKey += hybridJumps[jumpIdx];
                    if (hybridCurrentKey > activeTarget.end) {
                        hybridCurrentKey = activeTarget.start + (hybridCurrentKey % (activeTarget.end - activeTarget.start + 1n));
                    }
                }
                currentKey = hybridCurrentKey;
            }
            // 5. GENETİK ALGORİTMA
            else if (activeAlgo === 'GENETIC') {
                currentKey = generateGeneticKey(activeTarget.start, activeTarget.end);
            }
            // 6. P2P MULTI-TAB
            else if (activeAlgo === 'P2P') {
                currentKey = generateP2PKey(activeTarget.start, activeTarget.end);
            }
            // 7. ÖĞRENEN MOTOR
            else if (activeAlgo === 'LEARN') {
                currentKey = generateLearnKey(activeTarget.start, activeTarget.end);
            }
            // 8. MİKROFON ENTROPİSİ
            else if (activeAlgo === 'MIC') {
                currentKey = generateMicKey(activeTarget.start, activeTarget.end);
            }
            // 9. JİROSKOP / İVMEÖLÇER
            else if (activeAlgo === 'GYRO') {
                currentKey = generateGyroKey(activeTarget.start, activeTarget.end);
            }
            // 10. NİRVANA MOTORU
            else if (activeAlgo === 'NIRVANA') {
                currentKey = generateNirvanaKey(activeTarget.start, activeTarget.end, activeTarget.addr);
            }
            // 11. NAZAR MOTORU
            else if (activeAlgo === 'NAZAR') {
                currentKey = generateNazarKey(activeTarget.start, activeTarget.end);
            }
            // 12. KISMET MOTORU
            else if (activeAlgo === 'KISMET') {
                currentKey = generateKismetKey(activeTarget.start, activeTarget.end);
            }

            lastKeyHex = currentKey.toString(16);
            const currentH160 = privkeyToHash160(lastKeyHex);
            attempts++;
            if (sliceModeActive) sliceAttempts++;

            // YÜKSEK HIZLI HASH160 KARŞILAŞTIRMA (Base58 yükü olmadan 2x-3x daha hızlı)
            const targetH160 = activeTarget.targetHash160 || addressToHash160(activeTarget.addr);
            if (currentH160 === targetH160) {
                const winAddr = privkeyToAddress(lastKeyHex);
                document.getElementById('statAttempts').innerText = attempts.toLocaleString();
                document.getElementById('logKey').innerText = '0x' + lastKeyHex;
                handleWin(activeTarget.id, lastKeyHex, winAddr, activeTarget.addr, activeTarget.reward);
                return;
            }

            // 🏛️ Satoshi/Patoshi çoklu-hedef kontrolü (aktifse)
            if (satoshiMultiTargetActive && satoshiHashSet) {
                if (satoshiHashSet.has(currentH160)) {
                    const winAddr = privkeyToAddress(lastKeyHex);
                    document.getElementById('statAttempts').innerText = attempts.toLocaleString();
                    document.getElementById('logKey').innerText = '0x' + lastKeyHex;
                    handleWin('SATOSHI', lastKeyHex, winAddr, currentH160, 0);
                    return;
                }
            }
        }

        if (Date.now() - lastUIUpdate > 100) {
            document.getElementById('statAttempts').innerText = attempts.toLocaleString();
            if (activeTarget) {
                document.getElementById('logTarget').innerHTML = `Puzzle #${activeTarget.id} -> ${activeTarget.addr} <span style="color:#f59e0b; font-weight:bold; font-size:11px;">(+21.953 Satoshi 🏛️)</span>`;
                const rangeText = isRangeAuto 
                    ? `0x${activeTarget.start.toString(16)} - 0x${activeTarget.end.toString(16)} (Oto: %${sliceStartPct}-%${sliceEndPct})`
                    : `0x${activeTarget.start.toString(16)} - 0x${activeTarget.end.toString(16)}`;
                document.getElementById('logRange').innerText = rangeText;
            }
            if (selectedAlgorithm === 'AUTO') {
                const algoNames = {
                    'RANDOM':  '🎲 Rastgele Modu',
                    'HYBRID':  '🔀 Hibrit Modu'
                };
                document.getElementById('logAlgo').innerText = `🔄 Oto Geçiş [${algoNames[autoAlgoList[autoAlgoIndex]]}]`;
            }
            if (lastKeyHex) {
                document.getElementById('logKey').innerText = '0x' + lastKeyHex;
            }
            lastUIUpdate = Date.now();
        }
    } catch(err) {
        console.error('Hata:', err);
    }

    if (isRunning) {
        setTimeout(huntBatch, 4);
    }
}

    alert(`🎉 TEBRİKLER! PUZZLE #${puzzleId} İÇİN ÖZEL ANAHTAR BULUNDU!\n\nPrivate Key: 0x${keyHex}`);
}

function copyWinKey() {
    if (foundKeyHex) {
        navigator.clipboard.writeText('0x' + foundKeyHex);
        alert('Özel anahtar panoya kopyalandı:\n0x' + foundKeyHex);
    }
}

function checkSavedWins() {
    for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k.startsWith('BTC_WIN_PUZZLE_')) {
            const win = JSON.parse(localStorage.getItem(k));
            foundKeyHex = win.privateKey.replace('0x', '');
            const winBox = document.getElementById('winAlert');
            const winDetails = document.getElementById('winDetails');
            winBox.style.display = 'block';
            winDetails.innerHTML = `
                <strong>🏆 DAHA ÖNCE BULUNAN ÖDÜL:</strong> Puzzle #${win.puzzleId} (${win.reward})<br>
                <strong>🔒 Hedef Cüzdan:</strong> ${win.targetAddr}<br>
                <strong>🔑 GİZLİ ŞİFRE:</strong> <span style="color: #f59e0b; font-weight: 800;">${win.privateKey}</span>
            `;
            break;
        }
    }
}

function toggleHunter() {
    const btn = document.getElementById('btnToggle');
    const btnUnsolved = document.getElementById('btnMainUnsolved');
    const btnSolved = document.getElementById('btnMainSolved');
    const algoButtons = document.querySelectorAll('.algo-btn');

    if (isRunning) {
        isRunning = false;
        releaseWakeLock();
        btn.className = 'action-btn btn-start';
        btn.innerText = '▶ Aramayı Başlat';
        clearInterval(timerInterval);

        btnUnsolved.classList.remove('locked');
        btnSolved.classList.remove('locked');
        algoButtons.forEach(b => b.classList.remove('locked'));
        const rangeSel = document.getElementById('rangeSelect');
        if (rangeSel) {
            rangeSel.disabled = false;
            rangeSel.style.opacity = '1';
            rangeSel.style.cursor = 'pointer';
        }

        // Mikrofon modu değilse durdur
        if (selectedAlgorithm !== 'MIC') stopMicEntropy();
    } else {
        closePopups();
        requestWakeLock();
        if (!ec) ec = new elliptic.ec('secp256k1');
        isRunning = true;
        // P2P: kanal yoksa oluştur
        if (!p2pChannel) initP2P();
        // MIC modu: mikrofonu başlat
        if (selectedAlgorithm === 'MIC') startMicEntropy();
        btn.className = 'action-btn btn-stop';
        btn.innerText = '⏹ Aramayı Durdur';

        btnUnsolved.classList.add('locked');
        btnSolved.classList.add('locked');
        algoButtons.forEach(b => b.classList.add('locked'));
        const rangeSel = document.getElementById('rangeSelect');
        if (rangeSel) {
            rangeSel.disabled = true;
            rangeSel.style.opacity = '0.5';
            rangeSel.style.cursor = 'not-allowed';
        }

        if (!startTime) startTime = Date.now();
        
        timerInterval = setInterval(() => {
            const sec = Math.floor((Date.now() - startTime) / 1000);
            const hrs = String(Math.floor(sec / 3600)).padStart(2, '0');
            const mins = String(Math.floor((sec % 3600) / 60)).padStart(2, '0');
            const secs = String(sec % 60).padStart(2, '0');
            document.getElementById('statElapsed').innerText = hrs + ':' + mins + ':' + secs;
            
            const speed = sec > 0 ? (attempts / sec).toFixed(1) : 0;
            document.getElementById('statSpeed').innerText = speed + ' key/s';
        }, 1000);

        huntBatch();
    }
}

// ============================================================
// 🌐 BLOKZİNCİR CANLI KONTROL & OTOMATİK ARŞİVLEME MOTORU
// Sayfa açıldığında açık bulmacaların bakiyesini arka planda
// sessizce mempool.space üzerinden sorgular. Çözülenler (bakiye=0)
// anında Arşiv listesine taşınır.
// ============================================================
let isCheckingOnChain = false;

async function checkOnChainPuzzleStatus() {
    if (isCheckingOnChain) return;
    isCheckingOnChain = true;

    const unsolved = ALL_PUZZLES.filter(p => p.status === 'UNSOLVED');
    let hasNewlySolved = false;

    // İlk 15 açık bulmacayı öncelikli olarak tek tek kontrol et
    for (let i = 0; i < Math.min(unsolved.length, 15); i++) {
        const p = unsolved[i];
        try {
            const resp = await fetch(`https://mempool.space/api/address/${p.addr}`);
            if (resp.ok) {
                const data = await resp.json();
                const funded = data.chain_stats ? data.chain_stats.funded_txo_sum : 0;
                const spent = data.chain_stats ? data.chain_stats.spent_txo_sum : 0;
                const balanceSats = funded - spent;

                if (balanceSats === 0 && funded > 0) {
                    // Bulmaca çözülmüş ve parası çekilmiş!
                    console.log(`[ON-CHAIN] 🎉 Puzzle #${p.id} çözülmüş bulundu, arşive taşınıyor!`);
                    p.status = 'SOLVED';
                    localStorage.setItem('PUZZLE_STATUS_' + p.id, 'SOLVED');
                    hasNewlySolved = true;
                }
            }
        } catch (e) {
            // Ağ hatası veya rate-limit durumunda sessizce devam et
        }
        // Blokzincir API'sine yük bindirmemek için 200ms bekleme
        await new Promise(r => setTimeout(r, 200));
    }

    if (hasNewlySolved) {
        buildCustomMenus();
    checkOnChainPuzzleStatus();
    }
    isCheckingOnChain = false;
}

window.onload = function() {
    buildCustomMenus();
    checkOnChainPuzzleStatus();
    checkSavedWins();
    initP2P();
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').then(reg => {
            reg.update();
        }).catch(() => {});
    }
};
</script>
